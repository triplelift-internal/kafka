name: Build and Test Kafka

on:
  workflow_dispatch:
  pull_request:
    branches: [ "3.6.2-tl"]

jobs:
  build_test_and_upload_kafka:
    name: Build and Test Kafka
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@v1
        
      - name: Clean build directory
        run: ./gradlew clean
              
      - name: Build Kafka with compatible Protobuf version
        run: |
          ./gradlew build -Porg.gradle.jvmargs="-Dprotobuf.version=3.25.5" \
            -Dprotobuf.version=3.25.5