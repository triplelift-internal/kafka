name: Build and Upload Kafka Libraries

on:
  workflow_dispatch:
  push:
    branches: [ "3.6.2-tl" ]

jobs:
  build_and_upload_kafka:
    name: Build and Upload Kafka Libraries
    runs-on: [self-hosted, prod]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@v1
        
      - name: Clean build directory
        run: ./gradlew clean
              
      - name: Build Kafka with compatible Protobuf version
        run: |
          ./gradlew build -x tests -Porg.gradle.jvmargs="-Dprotobuf.version=3.25.5" \
            -Dprotobuf.version=3.25.5

      - name: Upload Kafka libraries to S3
        run: |
          VERSION=3.6.2-tl
          S3_BASE_LOCATION=s3://ops.triplelift.net/public/kafka/${VERSION}
          
          # Create a temporary directory for unique jars
          TEMP_DIR=$(mktemp -d)
          trap 'rm -rf "$TEMP_DIR"' EXIT
          
          # Find all jars and only copy unique ones based on filename
          for jar in $(find . -name "*.jar")
          do
            jar_name=$(basename "$jar")
            if [ ! -f "${TEMP_DIR}/${jar_name}" ]; then
              cp "$jar" "${TEMP_DIR}/${jar_name}"
              aws s3 cp "$jar" "${S3_BASE_LOCATION}/${jar_name}"
              echo "Uploaded: $jar_name"
            else
              echo "Skipped duplicate: $jar_name (already uploaded from different path)"
            fi
          done
